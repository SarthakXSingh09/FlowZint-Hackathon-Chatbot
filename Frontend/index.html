<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="page-bg">
    <div class="chat-container">

 
      <div class="chat-header">
        <div class="header-left">
          <div class="bot-avatar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="10" rx="2"/>
              <circle cx="12" cy="5" r="2"/>
              <path d="M12 7v4"/>
              <line x1="8" y1="16" x2="8" y2="16"/>
              <line x1="16" y1="16" x2="16" y2="16"/>
            </svg>
          </div>
          <div class="header-info">
            <span class="bot-name">Sales Assistant</span>
            <span class="bot-status">
              <span class="status-dot"></span>
              Online
            </span>
          </div>
        </div>
        <div class="header-right">
          <button class="icon-btn" title="Minimize" onclick="toggleChat()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Messages Area -->
      <div class="chat-messages" id="messages">
        <div class="date-divider"><span>Today</span></div>

        <!-- Initial bot message -->
        <div class="msg-row bot" id="welcome-msg">
          <div class="msg-avatar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="10" rx="2"/>
              <circle cx="12" cy="5" r="2"/>
              <path d="M12 7v4"/>
            </svg>
          </div>
          <div class="msg-col">
            <div class="bubble bot-bubble">
              Hi there! 👋 I'm your personal sales assistant.<br/>I'm here to help you find exactly what you need.<br/><br/>What can I help you with today?
            </div>
            <span class="msg-time" id="welcome-time"></span>
          </div>
        </div>
      </div>

      <!-- Quick Replies -->
      <div class="quick-replies" id="quick-replies">
        <button class="qr-btn" onclick="sendQuick(this)">View plans &amp; pricing</button>
        <button class="qr-btn" onclick="sendQuick(this)">Book a free demo</button>
        <button class="qr-btn" onclick="sendQuick(this)">Talk to sales</button>
        <button class="qr-btn" onclick="sendQuick(this)">Learn more</button>
      </div>

      <!-- Input Area -->
      <div class="chat-input-area">
        <textarea
          class="chat-input"
          id="chat-input"
          placeholder="Type a message..."
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" aria-label="Send message">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>

      <!-- Footer -->
      <div class="chat-footer">
        Powered by <strong>AI</strong> · Always here to help
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
